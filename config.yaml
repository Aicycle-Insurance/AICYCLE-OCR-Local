# Cú pháp ${ENV_NAME:default}: lấy biến môi trường (hoặc từ file .env),
# nếu không có thì dùng giá trị default phía sau dấu ':' (để trống = null).

app:
  data_dir: ${DATA_DIR:data}
  log_dir: ${LOG_DIR:logs}
  log_level: ${LOG_LEVEL:INFO}

ocr:
  # Engine OCR được dùng: chandra | dots_mocr
  engine: ${OCR_ENGINE:chandra}
  dpi: ${OCR_DPI:200}
  # Tổng số request đang gửi tới vLLM OCR của cả process (dùng chung cho mọi file đang xử lý)
  max_concurrency: ${OCR_MAX_CONCURRENCY:8}
  # Retry mỗi trang khi lỗi (mất kết nối, 5xx...), delay tăng gấp đôi sau mỗi lần
  retry:
    max_attempts: ${OCR_RETRY_MAX_ATTEMPTS:3}
    initial_delay: ${OCR_RETRY_INITIAL_DELAY:2.0}
    max_delay: ${OCR_RETRY_MAX_DELAY:30.0}
  # Request bị timeout (server không trả token, xem stall_timeout) thì không retry mà ngừng gửi request
  # mới trong chừng này giây; các trang trong lúc đó báo lỗi ngay, resume sau. 0 = tắt (retry như lỗi khác)
  circuit_cooldown: ${OCR_CIRCUIT_COOLDOWN:120}
  engines:
    chandra:
      base_url: ${CHANDRA_BASE_URL:http://localhost:8000/v1}
      api_key: ${CHANDRA_API_KEY:abc}
      model: ${CHANDRA_MODEL:chandra}
      timeout: ${CHANDRA_TIMEOUT:600}
      # Quá số giây này không nhận được token nào (kể cả lúc chờ token đầu) thì ngắt request và retry
      stall_timeout: ${CHANDRA_STALL_TIMEOUT:120}
      temperature: 0.0
      top_p: 0.1
      # Tổng token output tối đa của 1 trang
      max_tokens: 16000
      # max_tokens của mỗi request; trang dài hơn thì viết tiếp ở request sau. Request bị ngắt (cắt lặp)
      # có thể vẫn chạy tiếp trên vLLM (VD đi qua SSH tunnel), giới hạn này chặn mức GPU bị phí
      segment_tokens: ${CHANDRA_SEGMENT_TOKENS:2048}
    dots_mocr:
      base_url: ${DOTS_MOCR_BASE_URL:http://localhost:8001/v1}
      api_key: ${DOTS_MOCR_API_KEY:abc}
      model: ${DOTS_MOCR_MODEL:rednote-hilab/dots.mocr}
      timeout: ${DOTS_MOCR_TIMEOUT:600}
      temperature: 0.1
      top_p: 0.9
      max_tokens: 32768

llm:
  base_url: ${LLM_BASE_URL:http://localhost:10100/v1}
  api_key: ${LLM_API_KEY:abc}
  model: ${LLM_MODEL:nvidia/Gemma-4-26B-A4B-NVFP4}
  timeout: ${LLM_TIMEOUT:600}
  temperature: ${LLM_TEMPERATURE:0.0}
  top_p: ${LLM_TOP_P:}
  top_k: ${LLM_TOP_K:}
  max_tokens: ${LLM_MAX_TOKENS:16384}
  # Số request extraction (phase 2) chạy song song
  max_concurrent_extractions: ${LLM_MAX_CONCURRENT_EXTRACTIONS:3}
  # Số trang mỗi lần gọi phase 2 cho tài liệu dài có bảng (0 = tắt)
  table_chunk_pages: ${LLM_TABLE_CHUNK_PAGES:4}
  # Truyền thẳng vào extra_body của vLLM, ví dụ tắt thinking:
  # chat_template_kwargs: {enable_thinking: false}
  extra_body: {}

# API src.app check /health của vLLM OCR + LLM định kỳ, warmup khi model vừa bật
health:
  interval: ${HEALTH_CHECK_INTERVAL:10}
  timeout: ${HEALTH_CHECK_TIMEOUT:5}
  # Model đang ready chỉ bị coi là down (và warmup lại khi OK) sau chừng này lượt check lỗi liên tiếp,
  # để 1 lượt timeout lẻ (VD đường truyền nghẽn lúc gửi ảnh) không gây warmup thừa
  failure_threshold: ${HEALTH_CHECK_FAILURE_THRESHOLD:3}

langfuse:
  enabled: ${LANGFUSE_ENABLED:false}
  public_key: ${LANGFUSE_PUBLIC_KEY:}
  secret_key: ${LANGFUSE_SECRET_KEY:}
  base_url: ${LANGFUSE_BASE_URL:}
